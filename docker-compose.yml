services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loanplus
      POSTGRES_USER: loanplus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loanplus_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanplus -d loanplus"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://loanplus:${POSTGRES_PASSWORD:-loanplus_dev_only}@postgres:5432/loanplus?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      ID_ENCRYPTION_KEY_BASE64: ${ID_ENCRYPTION_KEY_BASE64:-}
      ID_HASH_KEY: ${ID_HASH_KEY:-}
      OTP_HASH_KEY: ${OTP_HASH_KEY:-}
      TERMS_VERSION: ${TERMS_VERSION:-draft-v1}
      PRIVACY_VERSION: ${PRIVACY_VERSION:-draft-v1}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_EMAIL_VERIFIED: ${SUPERADMIN_EMAIL_VERIFIED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MPESA_ENVIRONMENT: ${MPESA_ENVIRONMENT:-sandbox}
      MPESA_LIVE_ENABLED: ${MPESA_LIVE_ENABLED:-false}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORT_CODE: ${MPESA_SHORT_CODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "pnpm --filter @loanplus/api db:deploy && pnpm --filter @loanplus/api start:prod"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 8

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data: