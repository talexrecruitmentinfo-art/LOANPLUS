name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loanplus_test
          POSTGRES_USER: loanplus
          POSTGRES_PASSWORD: loanplus_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loanplus -d loanplus_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://loanplus:loanplus_dev_only@localhost:5432/loanplus_test?schema=public
      DIRECT_URL: postgresql://loanplus:loanplus_dev_only@localhost:5432/loanplus_test?schema=public
      TEST_DATABASE_URL: postgresql://loanplus:loanplus_dev_only@localhost:5432/loanplus_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @loanplus/api db:generate
      - run: pnpm --filter @loanplus/api db:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build